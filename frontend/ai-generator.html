<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SocialSync | Generate Post</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="dashboard-body">
    <div class="bg-mesh">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <aside class="sidebar glass-panel">
        <div class="brand">
            <div class="brand-logo">S</div>
            <h2>SocialSync</h2>
        </div>

        <nav class="nav-links">
            <a href="posts.html">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg>
                Post Composer
            </a>
            <a href="ai-generator.html" class="active">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
                Generate Post
            </a>
            <a href="posts.html">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path d="M3 12h18M12 3v18" />
                </svg>
                History
            </a>
        </nav>
    </aside>

    <main class="dashboard-main">
        <header class="dashboard-header">
            <div>
                <h1 class="page-title">AI Content Studio <span class="beta-badge">BETA</span></h1>
                <p class="page-subtitle">Transform your thoughts into engaging posts using AI.</p>
            </div>
            <div class="user-profile">
                <div class="avatar"></div>
            </div>
        </header>

        <div class="ai-container">
            <!-- Left Side: Input -->
            <div class="ai-input-card glass-panel">
                <div class="composer-header">
                    <h3>Generation Settings</h3>
                </div>

                <label class="input-label">Raw Content (Optional)</label>
                <textarea id="aiRawContent" placeholder="Paste an article, video transcript, or long notes here..."
                    class="glass-textarea" style="height: 150px; margin-bottom: 15px;"></textarea>

                <label class="input-label">Instructions / Topic</label>
                <textarea id="aiInstructions" placeholder="e.g. Write a catchy post about my new product launch..."
                    class="glass-textarea" style="height: 80px; margin-bottom: 20px;"></textarea>

                <div class="settings-grid">
                    <div>
                        <label class="input-label">Tone</label>
                        <select id="aiTone" class="glass-select">
                            <option value="Professional">Professional</option>
                            <option value="Casual & Friendly">Casual & Friendly</option>
                            <option value="Witty & Clever">Witty & Clever</option>
                            <option value="Inspirational">Inspirational</option>
                        </select>
                    </div>
                </div>

                <label class="input-label" style="margin-top: 20px;">Target Platforms</label>
                <div class="platform-toggles" style="margin-bottom: 25px;">
                    <label class="custom-toggle">
                        <input type="checkbox" value="LINKEDIN" class="ai-platform" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">LinkedIn</span>
                    </label>
                    <label class="custom-toggle">
                        <input type="checkbox" value="META" class="ai-platform" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Meta</span>
                    </label>
                    <label class="custom-toggle">
                        <input type="checkbox" value="MASTODON" class="ai-platform" checked>
                        <span class="toggle-slider"></span>
                        <span class="toggle-label">Mastodon</span>
                    </label>
                </div>

                <button id="generateBtn" class="btn btn-primary btn-ai" onclick="generateAIDrafts()"
                    style="width: 100%; justify-content: center;">
                    <span id="generateBtnText">Generate Magic</span>
                    <svg id="generateBtnIcon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
                        viewBox="0 0 24 24">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <div id="generateLoader" class="loader hidden"></div>
                </button>
            </div>

            <!-- Right Side: Results -->
            <div class="ai-results-area">
                <div id="aiResultsPlaceholder" class="placeholder-state">
                    <svg width="48" height="48" fill="none" stroke="#cbd5e1" stroke-width="1.5" viewBox="0 0 24 24"
                        style="margin-bottom: 15px;">
                        <path d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                    <p>Your AI-generated drafts will appear here.</p>
                </div>
                <div id="aiDraftsContainer" class="drafts-grid hidden">
                    <!-- Draft cards injected via JS -->
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>

</html>
